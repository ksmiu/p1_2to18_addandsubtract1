<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小學一年級數學：2-18的分解與合成</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=Mochiyom+P+One&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f0fdf4;
            background-image: radial-gradient(#bbf7d0 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            user-select: none;
        }

        .num-font {
            font-family: 'Mochiyom P One', 'Chakra Petch', cursive, sans-serif;
        }

        .draggable-item {
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            touch-action: none;
        }
        .draggable-item:active {
            cursor: grabbing;
            transform: scale(1.2) rotate(6deg);
            z-index: 50;
        }

        .drop-zone {
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .drop-zone.drag-over {
            background-color: #fef08a !important;
            border-color: #eab308 !important;
        }

        .tree-node {
            box-shadow: 0 6px 0 0 rgba(0, 0, 0, 0.1);
        }

        .math-input {
            text-align: center;
            font-family: 'Mochiyom P One', sans-serif;
            font-size: 1.75rem;
            color: #1e293b;
            border: 3px solid #94a3b8;
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            background-color: #ffffff;
        }
        .math-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.25);
            background-color: #eff6ff;
        }
        .math-input.correct {
            border-color: #22c55e !important;
            background-color: #f0fdf4 !important;
            color: #15803d;
        }
        .math-input.incorrect {
            border-color: #ef4444 !important;
            background-color: #fef2f2 !important;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        .btn-bounce {
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .btn-bounce:active {
            transform: translateY(3px);
            box-shadow: 0 2px 0 0 rgba(0, 0, 0, 0.2) !important;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-800 pb-6">

    <header class="bg-amber-400 border-b-4 border-amber-500 shadow-md py-3 px-4 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
            <div class="flex items-center gap-2">
                <span class="text-3xl">🐢</span>
                <h1 class="text-xl md:text-2xl font-black text-amber-950 tracking-wide">
                    2-18的分解與合成
                </h1>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <label for="rangeSelect" class="text-sm font-bold text-amber-900 hidden sm:inline">範圍：</label>
                <select id="rangeSelect" class="bg-white border-2 border-amber-600 font-bold rounded-xl px-3 py-1.5 text-amber-900 text-sm focus:outline-none cursor-pointer">
                    <option value="2-10">2 至 10 的分解合成</option>
                    <option value="11-18">11 至 18 的分解合成</option>
                    <option value="2-18" selected>2 至 18 (全部隨機)</option>
                </select>

                <select id="typeSelect" class="bg-white border-2 border-amber-600 font-bold rounded-xl px-3 py-1.5 text-amber-900 text-sm focus:outline-none cursor-pointer">
                    <option value="all">所有題目練習隨機</option>
                    <option value="1">題型1：圖案觀察分解</option>
                    <option value="2">題型2：數字樹填空</option>
                    <option value="3">題型3：加減算式連結</option>
                    <option value="4">題型4：動手搬運與綜合</option>
                    <option value="custom" class="text-indigo-700 font-bold">✨ 學生自由自擬題目模式</option>
                </select>

                <button onclick="speechPrompt()" title="朗讀題目" class="bg-sky-500 hover:bg-sky-600 text-white font-bold p-2 px-3 rounded-xl shadow-[0_4px_0_0_#0284c7] btn-bounce flex items-center gap-1">
                    <i class="fa-solid fa-volume-high text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col justify-center">
        <!-- Progress Bar -->
        <div class="flex justify-between items-center mb-4 bg-white/90 backdrop-blur rounded-2xl p-3 px-5 border-2 border-emerald-200 shadow-sm">
            <div class="flex items-center gap-2">
                <span class="font-bold text-emerald-800 text-sm md:text-base">模式：</span>
                <span id="questionCategory" class="bg-emerald-100 text-emerald-800 font-bold text-sm md:text-base px-3 py-1 rounded-full border border-emerald-300">
                    載入中...
                </span>
            </div>
            <div id="statsBar" class="flex items-center gap-4">
                <div class="text-slate-600 font-bold text-sm md:text-base">
                    得分: <span id="scoreDisplay" class="text-amber-600 text-xl font-black num-font">0</span>
                </div>
                <div class="text-slate-600 font-bold text-sm md:text-base">
                    已答: <span id="countDisplay" class="text-sky-600 text-xl font-black num-font">0</span>
                </div>
            </div>
        </div>

        <!-- Question Box Card -->
        <div class="bg-white rounded-3xl border-4 border-emerald-400 shadow-xl p-4 md:p-8 flex flex-col items-center relative overflow-hidden">
            
            <!-- Question Title -->
            <div id="questionTitle" class="w-full text-lg md:text-2xl font-bold text-slate-800 text-left mb-4 flex items-center gap-2 border-b-2 border-dashed border-slate-200 pb-3">
            </div>

            <!-- Dynamic Interactive Workspace -->
            <div id="workspace" class="w-full flex flex-col items-center gap-6 my-2">
            </div>

            <!-- Feedback Message -->
            <div id="feedbackMsg" class="min-h-[40px] text-center font-bold text-lg md:text-xl my-2 transition-all"></div>

            <!-- Bottom Action Buttons -->
            <div id="actionControls" class="flex flex-wrap justify-center items-center gap-4 mt-2 w-full">
                <button id="checkBtn" onclick="checkAnswer()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-black text-lg md:text-xl px-8 py-3 rounded-2xl shadow-[0_6px_0_0_#15803d] btn-bounce flex items-center gap-2">
                    <i class="fa-solid fa-circle-check"></i> 檢查答案
                </button>

                <button id="nextBtn" onclick="nextQuestion()" class="bg-sky-500 hover:bg-sky-600 text-white font-black text-lg md:text-xl px-8 py-3 rounded-2xl shadow-[0_0369a1] shadow-[0_6px_0_0_#0369a1] btn-bounce flex items-center gap-2">
                    下一題 <i class="fa-solid fa-arrow-right"></i>
                </button>

                <button id="hintBtn" onclick="showHint()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold text-base px-4 py-3 rounded-2xl border-2 border-amber-300 btn-bounce flex items-center gap-1">
                    <i class="fa-solid fa-lightbulb text-amber-500"></i> 提示
                </button>
            </div>
        </div>
    </main>

    <footer class="text-center text-xs md:text-sm text-slate-500 mt-4">
        香港小學一年級數學自主學習小程式 &copy; 2026 | 2-18的分解與合成
    </footer>

<script>
let currentQuestion = null;
let score = 0;
let totalAnswered = 0;

const ITEM_ICONS = [
    { name: '烏龜', emoji: '🐢' },
    { name: '小雞', emoji: '🐥' },
    { name: '星星', emoji: '⭐' },
    { name: '蘋果', emoji: '🍎' },
    { name: '心形', emoji: '❤️' },
    { name: '糖果', emoji: '🍬' },
    { name: '三角形', emoji: '🔺' }
];

// Custom Mode State
let customLeftCount = 5;
let customRightCount = 4;
let customIcon = '🐢';

// Web Audio API Sound Generation
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioContext();
    }
}

function playSound(type) {
    try {
        initAudio();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'correct') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.setValueAtTime(659.25, now + 0.1);
            osc.frequency.setValueAtTime(783.99, now + 0.2);
            osc.frequency.setValueAtTime(1046.50, now + 0.3);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
            osc.start(now);
            osc.stop(now + 0.6);
        } else if (type === 'wrong') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.setValueAtTime(180, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'click') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(450, now);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        }
    } catch(e) {
        console.log("Audio error:", e);
    }
}

function speechPrompt() {
    if (!currentQuestion) return;
    window.speechSynthesis.cancel();

    let textToRead = currentQuestion.readText || "請完成這道數學題。";
    let utterance = new SpeechSynthesisUtterance(textToRead);
    utterance.lang = 'zh-HK';
    utterance.rate = 0.85;
    window.speechSynthesis.speak(utterance);
}

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getRandomIcon() {
    return ITEM_ICONS[getRandomInt(0, ITEM_ICONS.length - 1)];
}

function generateQuestion() {
    const rangeVal = document.getElementById('rangeSelect').value;
    let minNum = 2;
    let maxNum = 18;

    if (rangeVal === '2-10') {
        minNum = 2; maxNum = 10;
    } else if (rangeVal === '11-18') {
        minNum = 11; maxNum = 18;
    }

    const typeVal = document.getElementById('typeSelect').value;

    if (typeVal === 'custom') {
        renderCustomMode();
        return;
    }

    document.getElementById('statsBar').style.display = 'flex';
    document.getElementById('actionControls').style.display = 'flex';

    let selectedType = typeVal;
    if (typeVal === 'all') {
        selectedType = getRandomInt(1, 4).toString();
    }

    // Constraint: Both Part A and Part B <= 9 (Max 9 per box rule)
    let N = getRandomInt(minNum, maxNum);
    let minA = Math.max(1, N - 9);
    let maxA = Math.min(9, N - 1);

    if (minA > maxA) { // fallback safety
        N = getRandomInt(2, 18);
        minA = Math.max(1, N - 9);
        maxA = Math.min(9, N - 1);
    }

    const A = getRandomInt(minA, maxA);
    const B = N - A;
    const iconObj = getRandomIcon();

    const feedback = document.getElementById('feedbackMsg');
    feedback.innerHTML = '';
    feedback.className = 'min-h-[40px] text-center font-bold text-lg md:text-xl my-2 transition-all';

    if (selectedType === '1') {
        currentQuestion = {
            type: 1,
            categoryName: '題型 1：圖案觀察分解',
            total: N, partA: A, partB: B,
            icon: iconObj.emoji,
            readText: `數一數圖案。${N} 可以分解為 ${A} 和幾多？`,
            titleText: `填一填：觀察方框內的圖案（每個框最多9個），完成分解。`
        };
    } else if (selectedType === '2') {
        const hideTarget = getRandomInt(1, 3);
        currentQuestion = {
            type: 2,
            categoryName: '題型 2：數字樹填空',
            total: N, partA: A, partB: B,
            hideTarget: hideTarget,
            readText: `觀察數字樹，填寫缺少的數字。`,
            titleText: `看數字樹填一填：`
        };
    } else if (selectedType === '3') {
        currentQuestion = {
            type: 3,
            categoryName: '題型 3：加減算式連結',
            total: N, partA: A, partB: B,
            readText: `根據數字樹，填寫對應的加法和減法算式。`,
            titleText: `看數字樹，填寫加法與減法算式：`
        };
    } else if (selectedType === '4') {
        currentQuestion = {
            type: 4,
            categoryName: '題型 4：動手搬運與綜合練習',
            total: N, partA: A, partB: B,
            icon: iconObj.emoji,
            readText: `在方框內移動 ${iconObj.emoji}（每框最多9個），使總數是 ${N}，然後完成下面的分解樹與算式。`,
            titleText: `在方框內搬運 ${iconObj.emoji}，使總數是 <span class="text-amber-600 font-black num-font px-1 text-2xl">${N}</span>，然後填一填：`
        };
    }

    document.getElementById('questionCategory').innerText = currentQuestion.categoryName;
    renderWorkspace();
}

function renderWorkspace() {
    const q = currentQuestion;
    const titleEl = document.getElementById('questionTitle');
    const ws = document.getElementById('workspace');

    titleEl.innerHTML = `<i class="fa-solid fa-lightbulb text-amber-500"></i> ` + q.titleText;
    ws.innerHTML = '';

    if (q.type === 1) {
        let leftIconsHtml = '';
        for (let i = 0; i < q.partA; i++) leftIconsHtml += `<span class="text-2xl md:text-3xl select-none">${q.icon}</span>`;
        
        let rightIconsHtml = '';
        for (let i = 0; i < q.partB; i++) rightIconsHtml += `<span class="text-2xl md:text-3xl select-none">${q.icon}</span>`;

        ws.innerHTML = `
            <div class="w-full max-w-lg border-4 border-sky-400 bg-sky-50 rounded-2xl p-4 flex justify-between items-center shadow-inner my-2">
                <div class="w-1/2 flex flex-wrap justify-center gap-2 border-r-2 border-dashed border-sky-300 pr-3 min-h-[80px] items-center">
                    ${leftIconsHtml}
                </div>
                <div class="w-1/2 flex flex-wrap justify-center gap-2 pl-3 min-h-[80px] items-center">
                    ${rightIconsHtml}
                </div>
            </div>

            <div class="flex flex-wrap items-center justify-center gap-3 text-xl md:text-2xl font-bold mt-4">
                <input type="number" id="ans_total" class="math-input w-16 h-14 md:w-20 md:h-16" placeholder="?">
                <span>分解為</span>
                <span class="num-font text-3xl text-emerald-600 bg-emerald-100 px-4 py-1 rounded-xl border border-emerald-300">${q.partA}</span>
                <span>和</span>
                <input type="number" id="ans_partB" class="math-input w-16 h-14 md:w-20 md:h-16" placeholder="?">
                <span>。</span>
            </div>
        `;
    } 
    else if (q.type === 2) {
        let topHtml = q.hideTarget === 1 
            ? `<input type="number" id="ans_tree_top" class="math-input w-20 h-20 rounded-full text-2xl" placeholder="?">`
            : `<div class="w-20 h-20 rounded-full bg-amber-200 border-4 border-amber-400 flex items-center justify-center text-3xl font-black num-font text-slate-800 tree-node">${q.total}</div>`;

        let leftHtml = q.hideTarget === 2
            ? `<input type="number" id="ans_tree_left" class="math-input w-16 h-16 rounded-full text-xl" placeholder="?">`
            : `<div class="w-16 h-16 rounded-full bg-emerald-200 border-4 border-emerald-400 flex items-center justify-center text-2xl font-black num-font text-slate-800 tree-node">${q.partA}</div>`;

        let rightHtml = q.hideTarget === 3
            ? `<input type="number" id="ans_tree_right" class="math-input w-16 h-16 rounded-full text-xl" placeholder="?">`
            : `<div class="w-16 h-16 rounded-full bg-emerald-200 border-4 border-emerald-400 flex items-center justify-center text-2xl font-black num-font text-slate-800 tree-node">${q.partB}</div>`;

        ws.innerHTML = `
            <div class="flex flex-col items-center justify-center my-4">
                ${topHtml}
                <svg class="w-48 h-12 my-1" viewBox="0 0 200 50">
                    <line x1="100" y1="0" x2="40" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                    <line x1="100" y1="0" x2="160" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                </svg>
                <div class="flex gap-16 items-center">
                    ${leftHtml}
                    ${rightHtml}
                </div>
            </div>
        `;
    }
    else if (q.type === 3) {
        ws.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center w-full max-w-2xl my-2">
                <div class="flex flex-col items-center bg-amber-50/50 p-4 rounded-2xl border-2 border-amber-200">
                    <div class="w-20 h-20 rounded-full bg-amber-200 border-4 border-amber-400 flex items-center justify-center text-3xl font-black num-font text-slate-800 tree-node">
                        ${q.total}
                    </div>
                    <svg class="w-40 h-10 my-1" viewBox="0 0 200 50">
                        <line x1="100" y1="0" x2="40" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                        <line x1="100" y1="0" x2="160" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                    </svg>
                    <div class="flex gap-12 items-center">
                        <input type="number" id="ans_tree_left" class="math-input w-16 h-16 rounded-full text-xl" placeholder="?">
                        <div class="w-16 h-16 rounded-full bg-emerald-200 border-4 border-emerald-400 flex items-center justify-center text-2xl font-black num-font text-slate-800 tree-node">
                            ${q.partB}
                        </div>
                    </div>
                </div>

                <div class="flex flex-col gap-6 justify-center text-xl md:text-2xl font-bold">
                    <div class="flex items-center gap-2">
                        <input type="number" id="ans_add_part" class="math-input w-16 h-14" placeholder="?">
                        <span>+</span>
                        <span class="num-font text-2xl">${q.partB}</span>
                        <span>=</span>
                        <span class="num-font text-2xl">${q.total}</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="num-font text-2xl">${q.total}</span>
                        <span>-</span>
                        <input type="number" id="ans_sub_part" class="math-input w-16 h-14" placeholder="?">
                        <span>=</span>
                        <span class="num-font text-2xl">${q.partB}</span>
                    </div>
                </div>
            </div>
        `;
    }
    else if (q.type === 4) {
        ws.innerHTML = `
            <div class="w-full max-w-xl bg-amber-50 rounded-2xl border-4 border-amber-400 p-4 shadow-md">
                <div class="text-sm font-bold text-amber-800 mb-2 flex justify-between items-center">
                    <span>提示：點擊或拖放 ${q.icon} 到右邊框（每個框最多9個）</span>
                    <button onclick="resetItemsType4()" class="text-xs bg-amber-200 hover:bg-amber-300 px-2 py-1 rounded-md text-amber-900 border border-amber-400">
                        <i class="fa-solid fa-arrow-rotate-left"></i> 重設
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div id="dropZoneLeft" class="drop-zone min-h-[120px] bg-white border-3 border-dashed border-amber-300 rounded-xl p-2 flex flex-wrap gap-2 content-start transition-all"
                         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'left')">
                    </div>

                    <div id="dropZoneRight" class="drop-zone min-h-[120px] bg-white border-3 border-dashed border-amber-300 rounded-xl p-2 flex flex-wrap gap-2 content-start transition-all"
                         ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)" ondrop="handleDrop(event, 'right')">
                    </div>
                </div>

                <div class="flex justify-between items-center mt-2 px-2 text-sm font-bold text-slate-600">
                    <span>左邊數量: <span id="countLeft" class="text-amber-600 font-black text-lg num-font">0</span> / 9</span>
                    <span>右邊數量: <span id="countRight" class="text-emerald-600 font-black text-lg num-font">0</span> / 9</span>
                </div>
            </div>

            <div class="w-full max-w-2xl grid grid-cols-1 md:grid-cols-2 gap-6 items-center mt-2">
                <div class="flex flex-col items-center">
                    <div class="w-20 h-20 rounded-full bg-amber-200 border-4 border-amber-400 flex items-center justify-center text-3xl font-black num-font text-slate-800 tree-node">
                        ${q.total}
                    </div>
                    <svg class="w-36 h-8 my-1" viewBox="0 0 200 50">
                        <line x1="100" y1="0" x2="40" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                        <line x1="100" y1="0" x2="160" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                    </svg>
                    <div class="flex gap-10 items-center">
                        <input type="number" id="ans_tree_left" class="math-input w-16 h-16 rounded-full text-xl" placeholder="?">
                        <input type="number" id="ans_tree_right" class="math-input w-16 h-16 rounded-full text-xl" placeholder="?">
                    </div>
                </div>

                <div class="flex flex-col gap-4 justify-center text-lg md:text-xl font-bold">
                    <div class="flex items-center gap-2">
                        <input type="number" id="ans_add1" class="math-input w-14 h-12" placeholder="?">
                        <span>+</span>
                        <input type="number" id="ans_add2" class="math-input w-14 h-12" placeholder="?">
                        <span>=</span>
                        <span class="num-font text-2xl">${q.total}</span>
                    </div>

                    <div class="flex items-center gap-2">
                        <span class="num-font text-2xl">${q.total}</span>
                        <span>-</span>
                        <input type="number" id="ans_sub1" class="math-input w-14 h-12" placeholder="?">
                        <span>=</span>
                        <input type="number" id="ans_sub2" class="math-input w-14 h-12" placeholder="?">
                    </div>
                </div>
            </div>
        `;

        initType4Items();
    }
}

function renderCustomMode() {
    document.getElementById('questionCategory').innerText = '✨ 學生自由自擬題目';
    document.getElementById('statsBar').style.display = 'none';
    document.getElementById('actionControls').style.display = 'none';

    currentQuestion = {
        type: 'custom',
        readText: `自由自擬模式：左邊有 ${customLeftCount} 個，右邊有 ${customRightCount} 個，總共有 ${customLeftCount + customRightCount} 個。`
    };

    const titleEl = document.getElementById('questionTitle');
    const ws = document.getElementById('workspace');

    titleEl.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles text-indigo-500"></i> 自由創作模式：選擇圖案並點擊增減/搬運，自動生成分解與合成算式！（每框最多9個）`;

    // Icon Selector HTML
    let iconSelectHtml = ITEM_ICONS.map(ic => `
        <button onclick="changeCustomIcon('${ic.emoji}')" class="px-3 py-1.5 rounded-xl border-2 text-xl transition-all ${customIcon === ic.emoji ? 'bg-indigo-100 border-indigo-500 scale-110 shadow-sm' : 'bg-white border-slate-200 hover:bg-slate-50'}">
            ${ic.emoji} <span class="text-xs text-slate-600 font-bold">${ic.name}</span>
        </button>
    `).join('');

    ws.innerHTML = `
        <!-- Icon Selector -->
        <div class="flex flex-wrap justify-center items-center gap-2 bg-indigo-50/80 p-3 rounded-2xl border border-indigo-200 w-full max-w-xl">
            <span class="font-bold text-indigo-900 text-sm">選擇圖案：</span>
            ${iconSelectHtml}
        </div>

        <!-- Interactive Drag / Tap Box Control -->
        <div class="w-full max-w-2xl bg-amber-50 rounded-2xl border-4 border-amber-400 p-4 shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Left Box -->
                <div class="bg-white rounded-xl border-2 border-amber-300 p-3 flex flex-col items-center">
                    <div class="flex justify-between items-center w-full mb-2">
                        <span class="font-bold text-amber-900">左框圖案: <span id="customLeftText" class="num-font text-xl text-amber-600">${customLeftCount}</span>/9</span>
                        <div class="flex gap-1">
                            <button onclick="updateCustomCount('left', -1)" class="w-8 h-8 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-700 font-black border border-rose-300">-</button>
                            <button onclick="updateCustomCount('left', 1)" class="w-8 h-8 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-black border border-emerald-300">+</button>
                        </div>
                    </div>
                    <div id="customLeftZone" class="min-h-[100px] w-full bg-slate-50 rounded-lg p-2 flex flex-wrap gap-2 content-start border border-dashed border-slate-300">
                    </div>
                </div>

                <!-- Right Box -->
                <div class="bg-white rounded-xl border-2 border-amber-300 p-3 flex flex-col items-center">
                    <div class="flex justify-between items-center w-full mb-2">
                        <span class="font-bold text-amber-900">右框圖案: <span id="customRightText" class="num-font text-xl text-emerald-600">${customRightCount}</span>/9</span>
                        <div class="flex gap-1">
                            <button onclick="updateCustomCount('right', -1)" class="w-8 h-8 rounded-lg bg-rose-100 hover:bg-rose-200 text-rose-700 font-black border border-rose-300">-</button>
                            <button onclick="updateCustomCount('right', 1)" class="w-8 h-8 rounded-lg bg-emerald-100 hover:bg-emerald-200 text-emerald-700 font-black border border-emerald-300">+</button>
                        </div>
                    </div>
                    <div id="customRightZone" class="min-h-[100px] w-full bg-slate-50 rounded-lg p-2 flex flex-wrap gap-2 content-start border border-dashed border-slate-300">
                    </div>
                </div>
            </div>
            <div class="text-xs text-center text-slate-500 mt-2">💡 提示：點擊圖案可直接將它搬運至另一邊喔！</div>
        </div>

        <!-- Dynamic Output Display -->
        <div class="w-full max-w-2xl bg-white border-2 border-indigo-200 rounded-2xl p-4 shadow-sm flex flex-col items-center gap-4">
            <!-- Dynamic Sentence -->
            <div class="text-xl md:text-2xl font-bold text-slate-800 text-center">
                <span id="customTotalText" class="num-font text-3xl text-indigo-600">${customLeftCount + customRightCount}</span>
                <span>分解為</span>
                <span id="customPartAText" class="num-font text-3xl text-amber-600">${customLeftCount}</span>
                <span>和</span>
                <span id="customPartBText" class="num-font text-3xl text-emerald-600">${customRightCount}</span>
            </div>

            <!-- Dynamic Number Tree & Equations -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center w-full pt-2 border-t border-slate-100">
                <!-- Tree -->
                <div class="flex flex-col items-center">
                    <div id="customTreeTop" class="w-16 h-16 rounded-full bg-indigo-200 border-4 border-indigo-400 flex items-center justify-center text-2xl font-black num-font text-slate-800 tree-node">
                        ${customLeftCount + customRightCount}
                    </div>
                    <svg class="w-32 h-8 my-1" viewBox="0 0 200 50">
                        <line x1="100" y1="0" x2="40" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                        <line x1="100" y1="0" x2="160" y2="50" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
                    </svg>
                    <div class="flex gap-8 items-center">
                        <div id="customTreeLeft" class="w-14 h-14 rounded-full bg-amber-200 border-4 border-amber-400 flex items-center justify-center text-xl font-black num-font text-slate-800 tree-node">
                            ${customLeftCount}
                        </div>
                        <div id="customTreeRight" class="w-14 h-14 rounded-full bg-emerald-200 border-4 border-emerald-400 flex items-center justify-center text-xl font-black num-font text-slate-800 tree-node">
                            ${customRightCount}
                        </div>
                    </div>
                </div>

                <!-- Equations -->
                <div class="flex flex-col gap-3 text-lg md:text-xl font-bold justify-center items-center md:items-start">
                    <div class="bg-indigo-50 px-4 py-2 rounded-xl text-indigo-900 border border-indigo-200">
                        加法：<span id="eqAdd" class="num-font text-xl">${customLeftCount} + ${customRightCount} = ${customLeftCount + customRightCount}</span>
                    </div>
                    <div class="bg-indigo-50 px-4 py-2 rounded-xl text-indigo-900 border border-indigo-200">
                        減法：<span id="eqSub" class="num-font text-xl">${customLeftCount + customRightCount} - ${customLeftCount} = ${customRightCount}</span>
                    </div>
                </div>
            </div>
        </div>
    `;

    renderCustomItems();
}

function changeCustomIcon(emoji) {
    customIcon = emoji;
    playSound('click');
    renderCustomMode();
}

function updateCustomCount(side, delta) {
    if (side === 'left') {
        const next = customLeftCount + delta;
        if (next >= 0 && next <= 9) customLeftCount = next;
    } else {
        const next = customRightCount + delta;
        if (next >= 0 && next <= 9) customRightCount = next;
    }
    playSound('click');
    renderCustomMode();
}

function renderCustomItems() {
    const leftZone = document.getElementById('customLeftZone');
    const rightZone = document.getElementById('customRightZone');
    if (!leftZone || !rightZone) return;

    leftZone.innerHTML = '';
    rightZone.innerHTML = '';

    for (let i = 0; i < customLeftCount; i++) {
        const item = document.createElement('span');
        item.className = 'text-2xl md:text-3xl cursor-pointer hover:scale-125 transition-transform select-none';
        item.innerText = customIcon;
        item.onclick = () => {
            if (customRightCount < 9) {
                customLeftCount--;
                customRightCount++;
                playSound('click');
                renderCustomMode();
            }
        };
        leftZone.appendChild(item);
    }

    for (let i = 0; i < customRightCount; i++) {
        const item = document.createElement('span');
        item.className = 'text-2xl md:text-3xl cursor-pointer hover:scale-125 transition-transform select-none';
        item.innerText = customIcon;
        item.onclick = () => {
            if (customLeftCount < 9) {
                customRightCount--;
                customLeftCount++;
                playSound('click');
                renderCustomMode();
            }
        };
        rightZone.appendChild(item);
    }
}

let itemPositions = {};

function initType4Items() {
    itemPositions = {};
    const totalN = currentQuestion.total;
    
    // Distribute initially: partA in left, remaining in left
    for (let i = 0; i < totalN; i++) {
        itemPositions[`item_${i}`] = 'left';
    }

    renderType4Items();
}

function resetItemsType4() {
    initType4Items();
    playSound('click');
}

function renderType4Items() {
    const leftContainer = document.getElementById('dropZoneLeft');
    const rightContainer = document.getElementById('dropZoneRight');
    if (!leftContainer || !rightContainer) return;

    leftContainer.innerHTML = '';
    rightContainer.innerHTML = '';

    let leftCount = 0;
    let rightCount = 0;

    Object.keys(itemPositions).forEach((id) => {
        const zone = itemPositions[id];
        const el = document.createElement('div');
        el.className = 'draggable-item text-3xl p-1 hover:scale-125 transition-transform cursor-pointer select-none';
        el.innerText = currentQuestion.icon;
        el.draggable = true;
        el.id = id;

        el.ondragstart = (e) => {
            e.dataTransfer.setData('text/plain', id);
        };

        el.onclick = () => {
            const currentZone = itemPositions[id];
            if (currentZone === 'left' && rightCount < 9) {
                itemPositions[id] = 'right';
                playSound('click');
                renderType4Items();
            } else if (currentZone === 'right' && leftCount < 9) {
                itemPositions[id] = 'left';
                playSound('click');
                renderType4Items();
            }
        };

        if (zone === 'left') {
            leftContainer.appendChild(el);
            leftCount++;
        } else {
            rightContainer.appendChild(el);
            rightCount++;
        }
    });

    document.getElementById('countLeft').innerText = leftCount;
    document.getElementById('countRight').innerText = rightCount;
}

function handleDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
}

function handleDragLeave(e) {
    e.currentTarget.classList.remove('drag-over');
}

function handleDrop(e, targetZone) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    const itemId = e.dataTransfer.getData('text/plain');

    // Count target zone current items
    let countInTarget = 0;
    Object.keys(itemPositions).forEach(k => {
        if (itemPositions[k] === targetZone) countInTarget++;
    });

    // Enforce Max 9 Rule per box
    if (itemId && itemPositions[itemId] && countInTarget < 9) {
        itemPositions[itemId] = targetZone;
        playSound('click');
        renderType4Items();
    }
}

function checkAnswer() {
    const q = currentQuestion;
    let isCorrect = false;
    const feedback = document.getElementById('feedbackMsg');

    if (q.type === 1) {
        const inputTotal = document.getElementById('ans_total');
        const inputB = document.getElementById('ans_partB');

        const valTotal = parseInt(inputTotal.value, 10);
        const valB = parseInt(inputB.value, 10);

        const okTotal = (valTotal === q.total);
        const okB = (valB === q.partB);

        markInput(inputTotal, okTotal);
        markInput(inputB, okB);

        isCorrect = okTotal && okB;
    }
    else if (q.type === 2) {
        if (q.hideTarget === 1) {
            const inputTop = document.getElementById('ans_tree_top');
            isCorrect = (parseInt(inputTop.value, 10) === q.total);
            markInput(inputTop, isCorrect);
        } else if (q.hideTarget === 2) {
            const inputLeft = document.getElementById('ans_tree_left');
            isCorrect = (parseInt(inputLeft.value, 10) === q.partA);
            markInput(inputLeft, isCorrect);
        } else if (q.hideTarget === 3) {
            const inputRight = document.getElementById('ans_tree_right');
            isCorrect = (parseInt(inputRight.value, 10) === q.partB);
            markInput(inputRight, isCorrect);
        }
    }
    else if (q.type === 3) {
        const inputLeft = document.getElementById('ans_tree_left');
        const inputAdd = document.getElementById('ans_add_part');
        const inputSub = document.getElementById('ans_sub_part');

        const okLeft = (parseInt(inputLeft.value, 10) === q.partA);
        const okAdd = (parseInt(inputAdd.value, 10) === q.partA);
        const okSub = (parseInt(inputSub.value, 10) === q.partA);

        markInput(inputLeft, okLeft);
        markInput(inputAdd, okAdd);
        markInput(inputSub, okSub);

        isCorrect = okLeft && okAdd && okSub;
    }
    else if (q.type === 4) {
        const inputLeft = document.getElementById('ans_tree_left');
        const inputRight = document.getElementById('ans_tree_right');
        const inputAdd1 = document.getElementById('ans_add1');
        const inputAdd2 = document.getElementById('ans_add2');
        const inputSub1 = document.getElementById('ans_sub1');
        const inputSub2 = document.getElementById('ans_sub2');

        const valLeft = parseInt(inputLeft.value, 10);
        const valRight = parseInt(inputRight.value, 10);
        const valAdd1 = parseInt(inputAdd1.value, 10);
        const valAdd2 = parseInt(inputAdd2.value, 10);
        const valSub1 = parseInt(inputSub1.value, 10);
        const valSub2 = parseInt(inputSub2.value, 10);

        const okTree = (valLeft + valRight === q.total) && (valLeft <= 9 && valRight <= 9);
        const okAdd = (valAdd1 + valAdd2 === q.total) && (valAdd1 === valLeft || valAdd1 === valRight);
        const okSub = (q.total - valSub1 === valSub2) && ((valSub1 === valLeft && valSub2 === valRight) || (valSub1 === valRight && valSub2 === valLeft));

        markInput(inputLeft, okTree);
        markInput(inputRight, okTree);
        markInput(inputAdd1, okAdd);
        markInput(inputAdd2, okAdd);
        markInput(inputSub1, okSub);
        markInput(inputSub2, okSub);

        isCorrect = okTree && okAdd && okSub;
    }

    if (isCorrect) {
        playSound('correct');
        feedback.className = 'min-h-[40px] text-center font-bold text-xl md:text-2xl my-2 text-emerald-600 animate-bounce';
        feedback.innerHTML = '🌟 太棒了！答對了！你真聰明！ 🎉';

        confetti({
            particleCount: 80,
            spread: 70,
            origin: { y: 0.6 }
        });

        score += 10;
        totalAnswered += 1;
        updateScoreBoard();

    } else {
        playSound('wrong');
        feedback.className = 'min-h-[40px] text-center font-bold text-xl md:text-2xl my-2 text-rose-500';
        feedback.innerHTML = '❌ 再試一次看看喔！加油！ 💪';
    }
}

function markInput(inputEl, isCorrect) {
    if (!inputEl) return;
    inputEl.classList.remove('correct', 'incorrect');
    if (isCorrect) {
        inputEl.classList.add('correct');
    } else {
        inputEl.classList.add('incorrect');
    }
}

function updateScoreBoard() {
    document.getElementById('scoreDisplay').innerText = score;
    document.getElementById('countDisplay').innerText = totalAnswered;
}

function nextQuestion() {
    playSound('click');
    generateQuestion();
}

function showHint() {
    playSound('click');
    const q = currentQuestion;
    const feedback = document.getElementById('feedbackMsg');
    feedback.className = 'min-h-[40px] text-center font-bold text-base md:text-lg my-2 text-amber-700 bg-amber-100 p-2 rounded-xl border border-amber-300';
    
    feedback.innerHTML = `💡 提示：總數是 <b>${q.total}</b>，其中一部分是 <b>${q.partA}</b>，另一部分是 <b>${q.partB}</b>。(${q.partA} + ${q.partB} = ${q.total})`;
}

document.getElementById('rangeSelect').addEventListener('change', () => {
    generateQuestion();
});
document.getElementById('typeSelect').addEventListener('change', () => {
    generateQuestion();
});

window.onload = function() {
    generateQuestion();
};
</script>
